name: 📈 Testing Benchmark (Informational)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'packages/testing/**'
      - '.github/workflows/testing-benchmark.yml'

permissions:
  contents: read

jobs:
  testing-benchmark:
    name: Testing fixture benchmark (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build dependencies
        run: pnpm exec turbo run build --filter=@redemeine/testing...

      - name: 📈 Run testing benchmark baseline
        run: pnpm --dir packages/testing run bench
