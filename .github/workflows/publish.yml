name: Publication held — nonpublishing refusal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse publication explicitly
        run: |
          printf '%s\n' 'Publication is HELD (redemeine-cwxu). This workflow cannot publish. Slice C is local rehearsal only; real repair qualification and separate owner authorization are required.' >&2
          exit 1
